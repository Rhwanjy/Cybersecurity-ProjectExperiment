<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#dff0ff">
  <title>EgyptAir | Cybersecurity Audit Checklist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./app.js"></script>
</head>
<body>
  <!-- Shared vector symbols: one cloud and one top-down airliner, both drawn facing the inline-end direction. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="cloud" viewBox="0 0 190 80">
        <g fill="currentColor">
          <circle cx="55" cy="52" r="22"/><circle cx="92" cy="38" r="30"/>
          <circle cx="132" cy="50" r="24"/><circle cx="162" cy="58" r="16"/>
          <rect x="34" y="52" width="140" height="22" rx="11"/>
        </g>
      </symbol>
      <symbol id="plane" viewBox="0 0 64 64">
        <g fill="currentColor">
          <rect x="4" y="29" width="56" height="6" rx="3"/>
          <path d="M31 30 L17 5 L24 5 L45 30 Z"/><path d="M31 34 L17 59 L24 59 L45 34 Z"/>
          <path d="M11 30 L4 19 L9 19 L18 30 Z"/><path d="M11 34 L4 45 L9 45 L18 34 Z"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <!-- Decorative sky. The layers are hidden from assistive technology and stop under reduced-motion settings. -->
  <div class="sky" aria-hidden="true">
    <span class="cloud c1"><svg><use href="#cloud"/></svg></span>
    <span class="cloud c2"><svg><use href="#cloud"/></svg></span>
    <span class="cloud c3"><svg><use href="#cloud"/></svg></span>
    <span class="cloud c4"><svg><use href="#cloud"/></svg></span>
    <span class="cloud c5"><svg><use href="#cloud"/></svg></span>
  </div>
  <div class="flight" aria-hidden="true">
    <svg viewBox="0 0 1200 230" preserveAspectRatio="xMidYMid slice" focusable="false">
      <path id="route" class="route" d="M-60 200 C 260 20, 620 250, 1260 40"/>
      <g class="jet" color="#0b2a4a">
        <use href="#plane" width="54" height="54" x="-27" y="-27"/>
        <animateMotion dur="22s" repeatCount="indefinite" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
          <mpath href="#route"/>
        </animateMotion>
      </g>
    </svg>
  </div>

  <!-- Static shell keeps landmarks and navigation accessible before data loads. -->
  <main>
    <header id="hero"></header>
    <p id="notice" role="status" hidden></p>
    <section id="summary"></section>
    <div class="workspace"><section id="checklist"></section><aside id="register"></aside></div>
  </main>
  <dialog id="modal" aria-labelledby="dialog-title"></dialog>
</body>
</html>
