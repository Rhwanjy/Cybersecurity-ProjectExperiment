<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#bcd8f2">
  <title>EgyptAir | Cybersecurity Audit Checklist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./app.js"></script>
</head>
<body>
  <!-- Shared vector symbols: one cloud and one top-down airliner, both drawn facing right. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="cloud" viewBox="0 0 190 80">
        <g fill="currentColor">
          <circle cx="55" cy="52" r="22"/><circle cx="92" cy="38" r="30"/>
          <circle cx="132" cy="50" r="24"/><circle cx="162" cy="58" r="16"/>
          <rect x="34" y="52" width="140" height="22" rx="11"/>
        </g>
      </symbol>
      <symbol id="plane" viewBox="0 0 64 64">
        <g fill="currentColor">
          <rect x="4" y="29" width="56" height="6" rx="3"/>
          <path d="M31 30 L17 5 L24 5 L45 30 Z"/><path d="M31 34 L17 59 L24 59 L45 34 Z"/>
          <path d="M11 30 L4 19 L9 19 L18 30 Z"/><path d="M11 34 L4 45 L9 45 L18 34 Z"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <!-- Decorative sky. The layers are hidden from assistive technology and stop under reduced-motion settings. -->
  <div class="sky" aria-hidden="true">
    <span class="cloud c1"><svg><use href="#cloud"/></svg></span>
    <span class="cloud c2"><svg><use href="#cloud"/></svg></span>
    <span class="cloud c3"><svg><use href="#cloud"/></svg></span>
    <span class="cloud c4"><svg><use href="#cloud"/></svg></span>
    <span class="cloud c5"><svg><use href="#cloud"/></svg></span>
  </div>
  <!-- A friendly sun in the corner: slow-turning rays and a soft glow. -->
  <div class="sun" aria-hidden="true">
    <svg viewBox="0 0 200 200" focusable="false">
      <defs><radialGradient id="sunFill" cx="40%" cy="38%" r="70%"><stop offset="0" stop-color="#fff6c2"/><stop offset=".6" stop-color="#ffd54a"/><stop offset="1" stop-color="#ffb21e"/></radialGradient></defs>
      <g class="rays" stroke="#ffc83a" stroke-width="9" stroke-linecap="round">
        <path d="M100 8v26M100 166v26M8 100h26M166 100h26M35 35l18 18M147 147l18 18M165 35l-18 18M53 147l-18 18"/>
      </g>
      <circle cx="100" cy="100" r="46" fill="url(#sunFill)"/>
    </svg>
  </div>

  <!-- The big airliner cruises diagonally across the whole screen, behind the content and clear of the globe. -->
  <div class="jet" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><use href="#plane"/></svg></div>

  <!-- Static shell keeps landmarks and navigation accessible before data loads. -->
  <main>
    <!-- Globe emblem: meridians turn, and a plane circles the orbit, passing behind the globe on the far side. -->
    <div class="emblem" aria-hidden="true">
      <svg viewBox="0 0 220 200" focusable="false">
        <defs>
          <radialGradient id="globeFill" cx="34%" cy="28%" r="85%">
            <stop offset="0" stop-color="#cfe8ff"/><stop offset=".5" stop-color="#5ba7ee"/><stop offset="1" stop-color="#1b5cb4"/>
          </radialGradient>
          <clipPath id="globeClip"><circle cx="110" cy="100" r="56"/></clipPath>
          <path id="orbit" d="M12 100 a98 28 0 1 1 196 0 a98 28 0 1 1 -196 0"/>
        </defs>
        <g transform="rotate(-18 110 100)">
          <use href="#orbit" class="orbit-ring"/>
          <!-- Far half of the orbit: the plane is drawn under the globe and hidden when it passes behind it. -->
          <g color="#0b2a4a" opacity=".55">
            <use href="#plane" width="26" height="26" x="-13" y="-13"/>
            <animateMotion dur="14s" repeatCount="indefinite" rotate="auto"><mpath href="#orbit"/></animateMotion>
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values=".55;0" keyTimes="0;.5"/>
          </g>
        </g>
        <circle cx="110" cy="100" r="56" fill="url(#globeFill)"/>
        <g clip-path="url(#globeClip)" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.2">
          <ellipse class="m m1" cx="110" cy="100" rx="56" ry="56"/>
          <ellipse class="m m2" cx="110" cy="100" rx="56" ry="56"/>
          <ellipse class="m m3" cx="110" cy="100" rx="56" ry="56"/>
          <ellipse class="m m4" cx="110" cy="100" rx="56" ry="56"/>
          <path d="M50 100 H170"/><path d="M52 76 Q110 88 168 76"/><path d="M52 124 Q110 136 168 124"/>
          <path d="M66 54 Q110 64 154 54"/><path d="M66 146 Q110 156 154 146"/>
        </g>
        <ellipse cx="90" cy="70" rx="22" ry="12" fill="#fff" opacity=".22" transform="rotate(-30 90 70)"/>
        <circle cx="110" cy="100" r="56" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.5"/>
        <g transform="rotate(-18 110 100)">
          <!-- Near half of the orbit: the plane is drawn over the globe. -->
          <g color="#0b2a4a" opacity="0">
            <use href="#plane" width="26" height="26" x="-13" y="-13"/>
            <animateMotion dur="14s" repeatCount="indefinite" rotate="auto"><mpath href="#orbit"/></animateMotion>
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;.5"/>
          </g>
        </g>
      </svg>
    </div>
    <header id="hero"></header>
    <p id="notice" role="status" hidden></p>
    <section id="summary"></section>
    <section id="checklist"></section>
  </main>
  <dialog id="modal" aria-labelledby="dialog-title"></dialog>
</body>
</html>
